name: Deploy homologation

# Push to the `homolog` branch (or run manually on it) to deploy.
# Setup: see infra/README.md, "Continuous deployment".
on:
  push:
    branches: ["homolog"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the backend test suite"
        type: boolean
        default: false

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    # The test context connects to Postgres on localhost (src/test/resources + application.properties).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: gravita
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test (unit, integration, ArchUnit)
        run: ./mvnw -B verify

  image:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (arm64 for Graviton)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:homolog
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build -- --configuration production

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/gravita-web/browser/
          retention-days: 1

  deploy:
    needs: [image, web]
    if: ${{ always() && needs.image.result == 'success' && needs.web.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: homolog
      url: ${{ vars.HOMOLOG_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BUCKET: ${{ vars.HOMOLOG_BUCKET }}
      INSTANCE_ID: ${{ vars.HOMOLOG_INSTANCE_ID }}
      BUNDLE_KEY: deploy/${{ github.sha }}.tar.gz
      APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: bundle/web

      - name: Install SOPS
        run: |
          curl -fsSL -o /usr/local/bin/sops \
            https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x /usr/local/bin/sops

      - name: Build release bundle
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          umask 077
          sops --decrypt --input-type dotenv --output-type dotenv infra/secrets/homolog.env > bundle/.env
          cp infra/compose/Caddyfile bundle/
          cp infra/compose/docker-compose.homolog.yaml bundle/docker-compose.yaml
          cp -r infra/scripts bundle/scripts
          tar -czf release.tar.gz bundle
          rm bundle/.env

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_HOMOLOG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload bundle
        run: aws s3 cp release.tar.gz "s3://${BUCKET}/${BUNDLE_KEY}" --sse AES256

      - name: Install on the VM (SSM Run Command)
        run: |
          script=$(cat <<EOF
          set -euo pipefail
          rel=\$(mktemp -d)
          trap 'rm -rf "\$rel"' EXIT
          docker run --rm -e AWS_DEFAULT_REGION=${AWS_REGION} -v "\$rel:/out" amazon/aws-cli \
            s3 cp s3://${BUCKET}/${BUNDLE_KEY} /out/release.tar.gz
          tar -xzf "\$rel/release.tar.gz" -C "\$rel"
          bash "\$rel/bundle/scripts/install-release.sh" "\$rel/bundle" "${APP_IMAGE}"
          EOF
          )
          params=$(jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["900"]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "Status: $status"
          [[ "$status" == "Success" ]]

      - name: Remove bundle
        if: always()
        run: aws s3 rm "s3://${BUCKET}/${BUNDLE_KEY}" || true

      - name: Smoke check
        if: ${{ vars.HOMOLOG_URL != '' }}
        run: |
          curl -fsS -o /dev/null -w 'Frontend: HTTP %{http_code}\n' "${{ vars.HOMOLOG_URL }}/"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.HOMOLOG_URL }}/api/")
          echo "API: HTTP $code"
          [[ "$code" != "000" && "$code" != "502" && "$code" != "503" ]]
