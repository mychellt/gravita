# Gravita homologation stack. Deployed to /opt/gravita on the VM as docker-compose.yaml,
# next to the Caddyfile, the decrypted .env and the Angular build in ./web.
#
# Values with a `$` (bcrypt hashes) must be single-quoted in .env.
# Memory limits fit a t4g.small (2 GB + 2 GB swap). On a t4g.medium, double app/postgres.
# AWS credentials: none here. The app and backups use the EC2 instance role (IMDSv2).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      HOMOLOG_DOMAIN: ${HOMOLOG_DOMAIN}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: hom
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      TZ: UTC
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGTZ: UTC
      TZ: UTC
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "5000"
    expose:
      - "1025"
      - "8025"
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config: