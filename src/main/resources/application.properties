spring.application.name=gravita
spring.datasource.url=jdbc:postgresql://localhost:5432/gravita
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
aws.region=us-east-1
gravita.system.integration-credential-encryption-key=${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY}
gravita.masterdata.certificate-encryption-key=${CERTIFICATE_ENCRYPTION_KEY}
gravita.pdv.supervisor-password-hash=${PDV_SUPERVISOR_PASSWORD_HASH}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
gravita.mail.sender=${APP_MAIL_SENDER:gravita@localhost}
# Base of the link in the activation e-mail: the API endpoint, which validates the token. ?token=... is appended.
gravita.activation.link-base-url=${ACTIVATION_LINK_BASE_URL:http://localhost:8080/api/activate}
# Where that endpoint then redirects the browser, with ?status=activated|expired|used|invalid|unavailable.
gravita.activation.result-page-url=${ACTIVATION_RESULT_PAGE_URL:http://localhost:4200/activate.html}
aws.sqs.user-registration-queue-name=${SQS_USER_REGISTRATION_QUEUE_NAME}
# Base of the link in the password reset e-mail: the reset page (an Angular route). The token is appended as ?token=...
gravita.password-reset.link-base-url=${PASSWORD_RESET_LINK_BASE_URL:http://localhost:4200/reset-password}
aws.sqs.password-reset-queue-name=${SQS_PASSWORD_RESET_QUEUE_NAME:password_reset_queue}

############ E-mail Configuration ############
# Local defaults point at the MailHog container from docker-compose (UI on :8025).
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Spring Cloud AWS (the SQS listener); the local profile points it at LocalStack.
spring.cloud.aws.region.static=${aws.region}
