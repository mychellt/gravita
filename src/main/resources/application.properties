spring.application.name=gravita

spring.datasource.url=jdbc:postgresql://localhost:5432/gravita
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

aws.region=us-east-1

gravita.system.integration-credential-encryption-key=${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY}
gravita.masterdata.certificate-encryption-key=${CERTIFICATE_ENCRYPTION_KEY}
gravita.pdv.supervisor-password-hash=${PDV_SUPERVISOR_PASSWORD_HASH}

# Supporting documents (boletos, NFs, receipts) are commonly larger than the 1MB default.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
