<main class="auth-page">
  <div class="auth-logo">Grav<span class="accent">ita</span></div>

  <section class="auth-card" aria-labelledby="forgot-title">
    <h1 class="auth-title" id="forgot-title">Esqueci minha senha</h1>
    <p class="auth-lead">Informe o e-mail da sua conta e enviaremos um link para você escolher uma nova senha.</p>

    <form (submit)="submit($event)" novalidate>
      <div class="auth-field">
        <label class="auth-label" for="forgot-email">E-mail</label>
        <input class="auth-input" id="forgot-email" name="email" type="email" inputmode="email"
               autocomplete="email" autofocus placeholder="ana@empresa.com.br"
               [value]="email()" (input)="onEmailInput($event)"
               [attr.aria-invalid]="emailError() ? 'true' : null"
               aria-describedby="forgot-email-error" />
        <p class="auth-error" id="forgot-email-error" role="alert">
          @if (emailError()) { <i class="ti ti-alert-circle" aria-hidden="true"></i><span>{{ emailError() }}</span> }
        </p>
      </div>

      <button type="submit" class="auth-btn" [disabled]="sending() || coolingDown()">
        @if (sending()) { Enviando… } @else if (coolingDown()) { Enviado! } @else { Enviar link }
      </button>

      <p class="auth-error" id="forgot-send-error" role="alert">
        @if (sendError()) { <i class="ti ti-alert-circle" aria-hidden="true"></i><span>{{ sendError() }}</span> }
      </p>
    </form>

    <div role="status" aria-live="polite">
      @if (sent()) {
        <p class="auth-feedback"><i class="ti ti-mail-check" aria-hidden="true"></i><span>{{ neutralMessage }}</span></p>
      }
    </div>

    <p class="auth-links"><a [routerLink]="loginPath">Voltar para o login</a></p>
  </section>
</main>
