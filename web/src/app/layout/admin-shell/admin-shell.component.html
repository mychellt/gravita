<div class="shell">
  <aside class="sidebar">

    <div class="sidebar-logo">
      <div class="logo-mark">G</div>
      <div>
        <div class="logo-text">Gravita</div>
        <div class="logo-sub">Administração</div>
      </div>
    </div>

    <div class="sidebar-company">
      <div class="company-pill admin-pill">
        <div class="company-dot admin-dot"><i class="ti ti-shield-lock"></i></div>
        <div>
          <div class="company-name">Plataforma</div>
          <div class="company-regime">Afeta todos os clientes</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav" aria-label="Administração">
      <div class="nav-section">Plataforma</div>
      @for (item of nav; track item.route) {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
          <i class="ni ti {{ item.icon }}"></i>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
      <div class="nav-section">Atalhos</div>
      <a class="nav-item" href="index.html#pricing" target="_blank" rel="noopener">
        <i class="ni ti ti-world"></i>
        <span class="nav-label">Ver site público</span>
        <i class="ti ti-external-link external"></i>
      </a>
    </nav>

    <div class="sidebar-footer">
      @if (user(); as u) {
        <div class="user-pill">
          <div class="user-avatar">{{ initials() }}</div>
          <div>
            <div class="user-name">{{ u.name }}</div>
            <div class="user-role">Admin da plataforma</div>
          </div>
          <button class="user-logout" type="button" title="Sair" aria-label="Sair" (click)="logout()">
            <i class="ti ti-logout"></i>
          </button>
        </div>
      }
    </div>

  </aside>

  <div class="shell-main">
    <header class="topbar">
      <div class="topbar-title">{{ titleSvc.title() }}</div>
      <span class="admin-env"><i class="ti ti-shield-lock"></i> Área administrativa</span>
    </header>
    <main class="shell-content">
      <router-outlet />
    </main>
  </div>
</div>
